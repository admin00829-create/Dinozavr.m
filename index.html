<style>
/* Layout: one centered column. Title, then a wide game stage with the HUD laid over it, a status line, touch controls and key hints. */
:root {
  --page: #e9efec;
  --card: #ffffff;
  --ink: #16241e;
  --muted: #566860;
  --line: #cfd9d4;
  --chip: #eef3f0;
  --accent: #e2682c;
  --accent-ink: #ffffff;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1613; --card: #16221d; --ink: #e7f0ea; --muted: #93a79d;
    --line: #26372f; --chip: #1f2f28; --accent: #ff8a4f; --accent-ink: #1a0e07;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1613; --card: #16221d; --ink: #e7f0ea; --muted: #93a79d;
  --line: #26372f; --chip: #1f2f28; --accent: #ff8a4f; --accent-ink: #1a0e07;
  color-scheme: dark;
}
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 12px;
}
.wrap { position: relative; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1 {
  margin: 0;
  font: 800 clamp(30px, 7vw, 48px)/1.02 var(--font-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 56ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 360px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; inset: 10px 10px auto 10px;
  display: flex; justify-content: flex-end; align-items: flex-start; gap: 6px; flex-wrap: wrap;
  pointer-events: none;
}
.hud .right { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip {
  background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 11px;
  font: 600 12px/1.5 var(--font-body);
  letter-spacing: 0.05em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.chip.dim { color: var(--muted); }
.chip.flash { animation: pop 0.6s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.18); background: var(--accent); color: var(--accent-ink); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .chip.flash { animation: none; } }
.banner {
  position: absolute; left: 50%; top: 35%; transform: translate(-50%, -50%);
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 18px;
  font: 800 clamp(16px, 4vw, 22px)/1.2 var(--font-display);
  pointer-events: none; white-space: nowrap;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.controls { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 2; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
.controls .btn { pointer-events: auto; }
.btn {
  width: 56px; height: 56px; padding: 0;
  display: grid; place-items: center;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn svg { width: 26px; height: 26px; display: block; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { background: var(--chip); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys { margin: 0; color: var(--muted); font-size: 14px; line-height: 2; }
kbd {
  font: 600 12px/1 var(--font-body);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px;
  padding: 2px 7px; background: var(--chip); color: var(--ink);
}
</style>

<main class="wrap">
  <section class="card">
    <div class="stage" id="stage">
      <canvas id="cv" role="img" aria-label="O'yin maydoni"></canvas>
      <div class="hud">
        <span class="chip" id="era">Trias davri</span>
        <span class="right">
          <span class="chip dim" id="hi">Rekord 00000</span>
          <span class="chip" id="score">00000</span>
        </span>
      </div>
      <div class="banner" id="banner" hidden></div>
    </div>
  </section>

  <div class="controls">
    <button type="button" class="btn primary" id="bJump" aria-label="Sakrash" title="Sakrash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
    </button>
    <button type="button" class="btn" id="bDuck" aria-label="Egilish (ushlab turing)" title="Egilish (ushlab turing)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg>
    </button>
    <button type="button" class="btn" id="bPause" aria-label="Pauza" title="Pauza"></button>
    <button type="button" class="btn" id="bSound" aria-label="Tovush" title="Tovush" aria-pressed="true"></button>
  </div>
  <p class="sr" id="status" aria-live="polite"></p>
</main>

};
const P = {};
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
for (const k in PAL) P[k] = [hexRgb(PAL[k][0]), hexRgb(PAL[k][1])];
const C = {};
function buildPalette(t) {
  for (const k in P) {
    const a = P[k][0], b = P[k][1];
    C[k] = 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
}

let emo = null;
function say(list, hold) {
  emo = { c: list[Math.floor(Math.random() * list.length)], age: 0, hold: !!hold };
}
function drawEmoji() {
  if (!emo) return;
  const d = dino, fy = GROUND + 2 + d.y, a = emo.age;
  let alpha = 1, rise, s;
  if (emo.hold) { rise = Math.sin(performance.now() / 260) * 1.5; s = 1.15; }
  else { rise = a * 0.35; alpha = a > 50 ? Math.max(0, 1 - (a - 50) / 20) : 1; s = Math.min(1, 0.4 + a / 10) * 1.1; }
  const y = Math.max(26, fy - (d.duck ? 44 : 62) - 6 - rise);
  ctx.save();
  ctx.globalAlpha = alpha; ctx.translate(d.x + 3, y); ctx.scale(s, s);
  ctx.font = '27px"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(emo.c, 0, 0);
  ctx.restore();
}

  clouds = [{ x: 90, y: 56, s: 1 }, { x: 250, y: 96, s: 0.8 }, { x: 410, y: 40, s: 1.15 }];
  stars = [];
  for (let i = 0; i < Math.round(H / 8); i++) stars.push({ x: Math.random() * W, y: 6 + Math.random() * (GROUND - 70), r: Math.random() < 0.2 ? 2 : 1, p: Math.random() * 6 });
  volcano = { x: 340 };
}

/* ---------- audio ---------- */
function ensureAudio() {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f1, f2, dur, type, vol, delay) {
  if (!soundOn || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  jump: () => tone(320, 640, 0.14, 'triangle', 0.09),
  die: () => tone(260, 50, 0.45, 'sawtooth', 0.07),
  mile: () => { tone(880, 880, 0.08, 'square', 0.04); tone(1175, 1175, 0.12, 'square', 0.04, 0.09); }
};

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(5, '0');
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function dinoBox() {
  const d = dino, fy = GROUND + 2 + d.y;
  if (d.duck) return { x: d.x - 10, y: fy - 35, w: 34, h: 32 };
  return { x: d.x - 9, y: fy - 52, w: 22, h: 49 };
}
function obBox(o) {
  if (o.t === 'p') return { x: o.x + 7, y: o.y + 9, w: o.w - 14, h: o.h - 16 };
  return { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 4 };
}
function gapFor(o) {
  const g = Math.round(o.w * speed + o.min * 0.6);
  return g + Math.random() * g * 0.5;
}
function eraName(s) { return s < 300 ? 'Trias' : s < 700 ? 'Yura' : s < 1400 ? "Bo'r" : 'Muzlik'; }

/* ---------- spawning ---------- */
function spawn() {
  if (score >= 300 && Math.random() < (score >= 1000 ? 0.4 : 0.3)) {
    const tops = [GROUND - 36, GROUND - 72];
    const o = { t: 'p', x: W + 10, y: tops[Math.floor(Math.random() * 2)], w: 46, h: 30, so: (Math.random() - 0.5) * 1.6, min: 150 };
    o.gap = gapFor(o); obstacles.push(o); return;
  }
  const pool = score < 100 ? GROUND_TYPES.slice(0, 4) : GROUND_TYPES;
  const t = pool[Math.floor(Math.random() * pool.length)];
  const o = { t: 'g', kind: t.kind, x: W + 10, w: t.w, h: t.h, y: GROUND + 2 - t.h, so: 0, min: 120 };
  o.gap = gapFor(o); obstacles.push(o);
}

/* ---------- game flow ---------- */
function setStatus(t) { el.status.textContent = t; }
function showBanner(t) { el.banner.textContent = t; el.banner.hidden = false; }
function hideBanner() { el.banner.hidden = true; }
function updateHud() {
  el.score.textContent = pad(score);
  el.hi.textContent = 'Rekord ' + pad(hi);
  el.era.textContent = eraName(score) + ' davri';
}
function startGame() {
  reset(); state = 'running'; hideBanner(); updateHud();
  setPauseIcon(false);
  setStatus("Sakrash: bo'sh joy yoki ↑. Egilish: ↓ ni ushlab turing.");
  startLoop();
}
function startLoop() { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
function jump() {
  if (state !== 'running') return;
  if (!dino.onGround) { jumpBuf = 7; return; }
  dino.vy = -(9.6 + speed / 14); dino.onGround = false; dino.duck = false; sfx.jump();
}
function die() {
  state = 'dead'; deadAt = performance.now(); sfx.die();
  if (score > hi) { hi = score; saveHi(hi); newRecord = true; }
  updateHud(); render();
  showBanner("O'yin tugadi · qayta bosing");
  say(LOSE, true); render();
  (function dl() { if (state !== 'dead') return; render(); requestAnimationFrame(dl); })();
  setStatus((newRecord ? 'Yangi rekord! ' : '') + 'Natija ' + score + ". Qayta boshlash uchun bo'sh joy bosing yoki ekranga tegining.");
}
function pause() {
  if (state !== 'running') return;
  state = 'paused'; wantDuck = false; showBanner('Pauza');
  setPauseIcon(true);
  setStatus('Davom etish uchun bosing yoki P tugmasini bosing.');
}
function resume() {
  if (state !== 'paused') return;
  state = 'running'; hideBanner(); setPauseIcon(false);
  setStatus("Sakrash: bo'sh joy yoki ↑. Egilish: ↓ ni ushlab turing.");
  startLoop();
}
function press() {
  ensureAudio();
  if (state === 'idle') { startGame(); jump(); }
  else if (state === 'running') jump();
  else if (state === 'dead') { if (performance.now() - deadAt > 450) { startGame(); jump(); } }
  else if (state === 'paused') resume();
}

function frame(ts) {
  raf = 0;
  if (state !== 'running') return;
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
  update(dt * 60);
  if (state === 'running') { render(); raf = requestAnimationFrame(frame); }
}

function update(k) {
  tick += k;
  if (jumpBuf > 0) jumpBuf -= k;
  speed = Math.min(MAXV, speed + 0.0013 * k);
  dist += speed * k;
  score = Math.floor(dist * 0.03);

  if (score >= nextNightAt) { nightTarget = 1 - nightTarget; nextNightAt += 700; }
  const dn = nightTarget - night;
  night += Math.sign(dn) * Math.min(Math.abs(dn), 0.006 * k);

  const d = dino;
  d.duck = wantDuck && d.onGround;
  if (!d.onGround) {
    d.vy += 0.6 * (wantDuck ? 3 : 1) * k;
    d.y += d.vy * k;
    if (d.y >= 0) { d.y = 0; d.vy = 0; d.onGround = true; if (jumpBuf > 0) { jumpBuf = 0; jump(); } }
  } else {
    d.phase += speed * 0.06 * k;
  }

  hillOff += speed * 0.18 * k;
  volcano.x -= speed * 0.07 * k;
  if (volcano.x < -190 * vs) volcano.x = W + 190 * vs + Math.random() * 250;
  for (const c of clouds) {
    c.x -= speed * 0.22 * k * c.s;
    if (c.x < -60) { c.x = W + 60 + Math.random() * 120; c.y = 24 + Math.random() * Math.max(90, GROUND * 0.55); }
  }
  for (const p of pebbles) {
    p.x -= speed * k;
    if (p.x < -8) { p.x += W + 16; p.y = GROUND + 6 + Math.random() * (H - GROUND - 10); p.w = 2 + Math.random() * 5; }
  }
  for (const o of obstacles) o.x -= (speed + o.so) * k;
  while (obstacles.length && obstacles[0].x + obstacles[0].w < -60) obstacles.shift();
  if (dist > 650) {
    const lastO = obstacles[obstacles.length - 1];
    if (!lastO || W - (lastO.x + lastO.w) >= lastO.gap) spawn();
  }

  if (emo && !emo.hold) { emo.age += k; if (emo.age > 70) emo = null; }

  const db = dinoBox();
  for (const o of obstacles) {
    if (hit(db, obBox(o))) { die(); return; }
    if (!o.done) {
      const overlap = db.x < o.x + o.w && db.x + db.w > o.x;
      if (overlap) {
        if (!dino.onGround) o.cleared = true;
        if (dino.duck && o.t === 'p') o.cleared = true;
      } else if (o.x + o.w <= db.x) {
        o.done = true;
        if (o.cleared) say(WIN, false);
      }
    }
  }

  const m = Math.floor(score / 100);
  if (m > lastMilestone) {
    lastMilestone = m; sfx.mile();
    el.score.classList.remove('flash'); void el.score.offsetWidth; el.score.classList.add('flash');
  }
  updateHud();
}

/* ---------- drawing: scene ---------- */
function drawStars() {
  if (night < 0.05) return;
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(tick * 0.04 + s.p));
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
}
function drawMoon() {
  if (night < 0.05) return;
  ctx.globalAlpha = night; ctx.save(); ctx.translate(-105, 16);
  ctx.fillStyle = C.moon; ctx.beginPath(); ctx.arc(510, 40, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.arc(505, 36, 3.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(514, 45, 2.4, 0, TAU); ctx.fill();
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawClouds() {
  ctx.fillStyle = C.cloud; ctx.globalAlpha = 0.85 - 0.5 * night;
  for (const c of clouds) {
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.s * 22, c.s * 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x + c.s * 14, c.y - c.s * 5, c.s * 14, c.s * 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x - c.s * 14, c.y - c.s * 2, c.s * 12, c.s * 5, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawVolcano() {
  const v = volcano, top = GROUND - 128;
  ctx.save(); ctx.translate(v.x, GROUND); ctx.scale(vs, vs); ctx.translate(-v.x, -GROUND);
  ctx.fillStyle = C.volcano; ctx.beginPath();
  ctx.moveTo(v.x - 165, GROUND); ctx.lineTo(v.x - 26, top); ctx.lineTo(v.x + 26, top); ctx.lineTo(v.x + 165, GROUND);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.35 + 0.65 * night;
  ctx.fillStyle = C.lava; ctx.beginPath(); ctx.ellipse(v.x, top + 1, 26, 5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C.lava; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(v.x - 8, top + 4); ctx.lineTo(v.x - 16, top + 44);
  ctx.moveTo(v.x + 9, top + 4); ctx.lineTo(v.x + 22, top + 32); ctx.stroke();
  ctx.fillStyle = C.cloud;
  for (let i = 0; i < 4; i++) {
    const p = ((tick * 0.4 + i * 30) % 120) / 120;
    ctx.globalAlpha = (1 - p) * 0.35;
    ctx.beginPath(); ctx.arc(v.x + Math.sin(p * 5 + i) * 8 + p * 30, top - 4 - p * 50, 6 + p * 12, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}
function drawHills() {
  ctx.fillStyle = C.hills; ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 6) {
    const u = x + hillOff;
    ctx.lineTo(x, GROUND - 30 - 12 * Math.sin(u / 70) - 6 * Math.sin(u / 26 + 1.3));
  }
  ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
}
function drawGround() {
  ctx.fillStyle = C.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = C.groundLine; ctx.fillRect(0, GROUND, W, 2);
  ctx.fillStyle = C.pebble;
  for (const p of pebbles) ctx.fillRect(p.x, p.y, p.w, 1.6);
}

/* ---------- drawing: obstacles ---------- */
function drawFern(cx, bottom, h) {
  ctx.strokeStyle = C.stem; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, bottom); ctx.lineTo(cx + 1, bottom - h); ctx.stroke();
  ctx.fillStyle = C.leaf;
  for (let i = 0; i < 5; i++) {
    const ly = bottom - h * (0.18 + i * 0.17), len = 12 - i * 1.5;
    for (const dir of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(cx, ly + 2);
      ctx.quadraticCurveTo(cx + dir * len * 0.7, ly - 7, cx + dir * len, ly - 6);
      ctx.quadraticCurveTo(cx + dir * len * 0.6, ly + 1, cx, ly + 2); ctx.fill();
    }
  }
  ctx.beginPath(); ctx.ellipse(cx + 1, bottom - h, 3, 5, 0, 0, TAU); ctx.fill();
}
function drawRock(x, bottom, w, h) {
  ctx.fillStyle = C.rock; ctx.beginPath();
  ctx.moveTo(x, bottom); ctx.lineTo(x + w * 0.08, bottom - h * 0.55); ctx.lineTo(x + w * 0.3, bottom - h);
  ctx.lineTo(x + w * 0.7, bottom - h * 0.92); ctx.lineTo(x + w * 0.95, bottom - h * 0.45); ctx.lineTo(x + w, bottom);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.rockHi; ctx.beginPath();
  ctx.moveTo(x + w * 0.08, bottom - h * 0.55); ctx.lineTo(x + w * 0.3, bottom - h); ctx.lineTo(x + w * 0.7, bottom - h * 0.92);
  ctx.lineTo(x + w * 0.5, bottom - h * 0.62); ctx.closePath(); ctx.fill();
}
function drawPtero(o) {
  const x = o.x, y = o.y, flap = Math.sin(tick * 0.35);
  ctx.fillStyle = C.pteroWing;
  ctx.beginPath(); ctx.moveTo(x + 14, y + 16); ctx.lineTo(x + 24, y + 16); ctx.lineTo(x + 19, y + 16 - flap * 22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.ptero;
  ctx.beginPath(); ctx.ellipse(x + 24, y + 17, 14, 6.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 9, y + 14, 6, 4.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 4, y + 12); ctx.lineTo(x - 8, y + 17); ctx.lineTo(x + 4, y + 17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + 21, y + 5); ctx.lineTo(x + 15, y + 13); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 36, y + 16); ctx.lineTo(x + 47, y + 19); ctx.lineTo(x + 36, y + 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.pteroWing;
  ctx.beginPath(); ctx.moveTo(x + 18, y + 16); ctx.lineTo(x + 33, y + 16); ctx.lineTo(x + 40, y + 16 - flap * 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 8, y + 13, 1.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#16241e'; ctx.beginPath(); ctx.arc(x + 7.4, y + 13, 0.8, 0, TAU); ctx.fill();
}
function drawObstacle(o) {
  if (o.t === 'p') { drawPtero(o); return; }
  const b = GROUND + 2;
  switch (o.kind) {
    case 'fern1': case 'fern1t': drawFern(o.x + o.w / 2, b, o.h); break;
    case 'fern2': case 'fern3': {
      const n = o.kind === 'fern2' ? 2 : 3;
      for (let i = 0; i < n; i++) drawFern(o.x + (o.w / n) * (i + 0.5), b, o.h * (i === 1 ? 1 : 0.86));
      break;
    }
    case 'rock1': drawRock(o.x, b, o.w, o.h); break;
    case 'rock2': drawRock(o.x, b, o.w * 0.62, o.h); drawRock(o.x + o.w * 0.5, b, o.w * 0.5, o.h * 0.68); break;
  }
}

/* ---------- drawing: the runner ---------- */
function leg(hx, hy, phase, air, scale) {
  let fx, fy;
  if (air) { fx = hx + (hx > 0 ? 7 : -5); fy = hx > 0 ? -4 : -9; }
  else { fx = hx + Math.sin(phase) * 9 * scale; fy = -Math.max(0, Math.cos(phase)) * 6 * scale; }
  const kx = (hx + fx) / 2 + 2, ky = (hy + fy) / 2 - 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = C.pants; ctx.lineWidth = 6.5;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.strokeStyle = C.skin; ctx.lineWidth = 4.2;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy - 3); ctx.stroke();
  ctx.fillStyle = C.shoe; ctx.beginPath(); ctx.ellipse(fx + 3, fy - 2.2, 6, 3.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C.sole; ctx.beginPath(); ctx.ellipse(fx + 3, fy - 0.3, 6, 1.3, 0, 0, TAU); ctx.fill();
}
function arm(sx, sy, phase, air, up) {
  let hx, hy;
  if (air) { hx = sx + (sx > 0 ? 9 : -7); hy = sy - (up ? 6 : 3); }
  else { hx = sx + Math.sin(phase) * 10; hy = sy + 8 - Math.cos(phase) * 2; }
  ctx.strokeStyle = C.hoodie; ctx.lineWidth = 4.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo((sx + hx) / 2 + 1, (sy + hy) / 2 + 1); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hx, hy, 2.8, 0, TAU); ctx.fill();
}
function head(cx, topY, w, h) {
  if (headReady) { ctx.drawImage(headImg, cx - w / 2, topY, w, h); return; }
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(cx, topY + h * 0.44, w * 0.45, h * 0.44, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1b1b1f'; ctx.beginPath(); ctx.ellipse(cx, topY + h * 0.2, w * 0.47, h * 0.2, 0, 0, TAU); ctx.fill();
}
function drawBoy() {
  const d = dino, fy = GROUND + 2 + d.y, dead = state === 'dead';
  const ph = state === 'idle' ? Math.PI / 2 : d.phase, air = !d.onGround;
  ctx.save(); ctx.translate(d.x, fy);
  if (d.duck) {
    leg(-5, -9, ph, false, 0.6);
    ctx.fillStyle = C.hoodie; ctx.beginPath(); ctx.ellipse(2, -15, 11, 7.5, -0.12, 0, TAU); ctx.fill();
    ctx.fillStyle = C.hoodieDark; ctx.fillRect(-6, -13, 14, 1.6);
    leg(5, -9, ph + Math.PI, false, 0.6);
    head(16, -37, 22, 28.5);
    ctx.strokeStyle = C.hoodie; ctx.lineWidth = 4.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(6, -17); ctx.lineTo(14, -10); ctx.stroke();
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(15, -9, 2.8, 0, TAU); ctx.fill();
  } else {
    const bob = air || dead ? 0 : Math.abs(Math.sin(ph)) * 1.2;
    arm(-3, -25, ph + Math.PI, air, false);
    leg(-2, -14, ph, air, 1);
    ctx.save(); ctx.translate(0, -14 - bob); ctx.rotate(dead ? -0.1 : 0.14);
    ctx.fillStyle = C.hoodie; ctx.beginPath(); ctx.ellipse(0, -7, 8.5, 9.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C.hoodieDark; ctx.fillRect(0.5, -15, 1.4, 14);
    ctx.fillStyle = C.pants; ctx.beginPath(); ctx.ellipse(0, -1, 8, 3.2, 0, 0, TAU); ctx.fill();
    ctx.restore();
    leg(3, -14, ph + Math.PI, air, 1);
    ctx.save();
    if (dead) { ctx.translate(3, -27); ctx.rotate(-0.28); ctx.translate(-3, 27); }
    head(3, -54 - bob, 26, 33.5);
    ctx.restore();
    arm(3, -25, ph, air, true);
  }
  ctx.restore();
}

/* ---------- render ---------- */
function render() {
  buildPalette(night);
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, C.skyTop); g.addColorStop(1, C.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawStars(); drawMoon(); drawClouds(); drawVolcano(); drawHills(); drawGround();
  for (const o of obstacles) drawObstacle(o);
  drawBoy();
  drawEmoji();
}

function resize() {
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  H = Math.max(240, Math.round(W * r.height / r.width));
  GROUND = Math.max(Math.round(H * 0.6), H - 170);
  vs = Math.min(2.2, Math.max(1, GROUND / 320));
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  sc = cv.width / W;
  if (state === 'idle') reset();
  render();
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
    e.preventDefault(); if (!e.repeat) press();
  } else if (c === 'ArrowDown' || c === 'KeyS') {
    e.preventDefault(); wantDuck = true;
  } else if (c === 'KeyP' || c === 'Escape') {
    if (state === 'running') pause(); else if (state === 'paused') resume();
  } else if (c === 'Enter' && state === 'dead') {
    press();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') wantDuck = false;
});
stage.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

el.bJump.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
el.bJump.addEventListener('click', e => { if (e.detail === 0) press(); });
function duckOn(e) { e.preventDefault(); ensureAudio(); wantDuck = true; el.bDuck.classList.add('on'); }
function duckOff() { wantDuck = false; el.bDuck.classList.remove('on'); }
el.bDuck.addEventListener('pointerdown', duckOn);
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.bDuck.addEventListener(t, duckOff));
el.bPause.addEventListener('click', () => {
  if (state === 'running') pause(); else if (state === 'paused') resume();
  el.bPause.blur();
});
el.bSound.addEventListener('click', () => {
  soundOn = !soundOn;
  setSoundIcon();
  if (soundOn) ensureAudio();
  el.bSound.blur();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- boot ---------- */
reset();
updateHud();
setStatus("Boshlash uchun bo'sh joy bosing yoki ekranga tegining.");
setPauseIcon(false); setSoundIcon();
showBanner('Boshlash uchun bosing');
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(cv);
window.addEventListener('resize', resize);
resize();
})();
</script>
